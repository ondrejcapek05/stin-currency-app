{% extends "base.html" %}

{% block content %}
<h1>{{ t('settings.title') }}</h1>

{% if saved %}
<p style="color: green">{{ t('settings.saved') }}</p>
{% endif %}

{% if error %}
<p style="color: red">{{ t(error) }}</p>
{% endif %}

<form method="post" action="/settings">
    <label>{{ t('settings.base_currency') }}
        <select name="base_currency" required>
            {% for c in available_currencies %}
            <option value="{{ c }}" {% if c == settings.base_currency %}selected{% endif %}>
                {{ c }}
            </option>
            {% endfor %}
        </select>
    </label>

    <fieldset>
        <legend>{{ t('settings.selected_currencies') }}</legend>

        {% for c in available_currencies %}
        <label>
            <input type="checkbox" name="selected_currencies" value="{{ c }}"
                {% if c in selected_list %}checked{% endif %}>
            {{ c }}
        </label>
        {% endfor %}
    </fieldset>

    <button type="submit">{{ t('settings.save') }}</button>
</form>
{% endblock %}
